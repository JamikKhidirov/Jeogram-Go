<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-labelledby="h3">
  <title id="h3">Раздел: звонки, уведомления и вебхуки</title>
  <style>
    .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;fill:#34d399}
    .s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#8ea2c4}
    .dash{stroke:#34d399;stroke-width:2;stroke-dasharray:10 10;animation:run 3s linear infinite}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:wave 1.1s ease-in-out infinite}
    @keyframes run{to{stroke-dashoffset:-40}}
    @keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  </style>
  <rect width="900" height="96" rx="18" fill="#080d1c"/>
  <rect x="1" y="1" width="898" height="94" rx="18" fill="none" stroke="#1d2b47" stroke-width="2"/>
  <rect x="14" y="18" width="6" height="60" rx="3" fill="#34d399"/>
  <circle cx="17" cy="48" r="12" fill="#34d399" opacity="0.35">
    <animate attributeName="opacity" values=".15;.65;.15" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text class="t" x="44" y="48">Звонки, push и вебхуки</text>
  <text class="s" x="44" y="70">LiveKit · APNs/FCM · webhook-события</text>
  <line class="dash" x1="44" y1="82" x2="600" y2="82"/>
  <g fill="#34d399">
    <rect class="bar" x="742" y="36" width="5" height="28" rx="2.5" style="animation-delay:0s"/>
    <rect class="bar" x="753" y="32" width="5" height="36" rx="2.5" style="animation-delay:.1s"/>
    <rect class="bar" x="764" y="38" width="5" height="24" rx="2.5" style="animation-delay:.2s"/>
    <rect class="bar" x="775" y="30" width="5" height="40" rx="2.5" style="animation-delay:.3s"/>
    <rect class="bar" x="786" y="36" width="5" height="28" rx="2.5" style="animation-delay:.4s"/>
    <rect class="bar" x="797" y="32" width="5" height="36" rx="2.5" style="animation-delay:.5s"/>
    <rect class="bar" x="808" y="38" width="5" height="24" rx="2.5" style="animation-delay:.6s"/>
    <rect class="bar" x="819" y="30" width="5" height="40" rx="2.5" style="animation-delay:.7s"/>
    <rect class="bar" x="830" y="36" width="5" height="28" rx="2.5" style="animation-delay:.8s"/>
  </g>
</svg>