<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-labelledby="h2">
  <title id="h2">Раздел: чаты и сообщения</title>
  <style>
    .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;fill:#8b5cf6}
    .s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#8ea2c4}
    .dash{stroke:#8b5cf6;stroke-width:2;stroke-dasharray:10 10;animation:run 3s linear infinite}
    @keyframes run{to{stroke-dashoffset:-40}}
    @keyframes dot{0%,60%{opacity:.2}61%,100%{opacity:1}}
  </style>
  <rect width="900" height="96" rx="18" fill="#080d1c"/>
  <rect x="1" y="1" width="898" height="94" rx="18" fill="none" stroke="#1d2b47" stroke-width="2"/>
  <rect x="14" y="18" width="6" height="60" rx="3" fill="#8b5cf6"/>
  <circle cx="17" cy="48" r="12" fill="#8b5cf6" opacity="0.35">
    <animate attributeName="opacity" values=".6;.15;.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text class="t" x="44" y="48">Чаты и сообщения</text>
  <text class="s" x="44" y="70">роли · реакции · закрепы · поиск · пересылка · E2EE</text>
  <line class="dash" x1="44" y1="82" x2="600" y2="82"/>
  <g>
    <rect x="760" y="30" width="112" height="26" rx="13" fill="#16223c" stroke="#8b5cf6"/>
    <rect x="790" y="46" width="96" height="26" rx="13" fill="#1c2c52" stroke="#22d3ee"/>
    <circle cx="778" cy="43" r="3" fill="#8b5cf6" style="animation:dot 1.2s infinite"/>
    <circle cx="808" cy="59" r="3" fill="#22d3ee" style="animation:dot 1.2s infinite .2s"/>
    <circle cx="822" cy="59" r="3" fill="#22d3ee" style="animation:dot 1.2s infinite .4s"/>
    <circle cx="836" cy="59" r="3" fill="#22d3ee" style="animation:dot 1.2s infinite .6s"/>
  </g>
</svg>