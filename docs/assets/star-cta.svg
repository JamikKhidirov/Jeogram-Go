<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 156" width="900" height="156" role="img" aria-labelledby="ctaT">
  <title id="ctaT">Анимированный призыв поставить звезду проекту Jeogram</title>
  <defs>
    <linearGradient id="stGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#f472b6;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#f472b6;#22d3ee;#8b5cf6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="stShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="stGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="stB"/>
      <feMerge>
        <feMergeNode in="stB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="stPill">
      <rect x="680" y="52" width="190" height="48" rx="24"/>
    </clipPath>
  </defs>

  <rect width="900" height="156" rx="24" fill="#080d1c"/>
  <rect x="1" y="1" width="898" height="154" rx="24" fill="none" stroke="#1d2b47" stroke-width="2"/>

  <g transform="translate(118 76)">
    <circle r="30" fill="none" stroke="#8b5cf6" stroke-width="2">
      <animate attributeName="r" values="26;54;26" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#22d3ee" stroke-width="2">
      <animate attributeName="r" values="26;48;26" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#stGlow)">
      <polygon fill="url(#stGrad)" points="0,-26 6.47,-8.90 24.73,-8.03 10.46,3.40 15.28,21.03 0,11 -15.28,21.03 -10.46,3.40 -24.73,-8.03 -6.47,-8.90">
        <animateTransform attributeName="transform" type="scale" values="1;1.14;1" dur="2s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <text x="200" y="68" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="url(#stGrad)">Поддержите проект звёздочкой</text>
  <text x="200" y="98" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8ea2c4">
    Каждая звезда ускоряет развитие Jeogram
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>

  <rect x="680" y="52" width="190" height="48" rx="24" fill="#0d1528" stroke="url(#stGrad)" stroke-width="2"/>
  <g clip-path="url(#stPill)">
    <rect x="640" y="48" width="60" height="56" fill="url(#stShine)">
      <animate attributeName="x" values="640;850;850" keyTimes="0;0.45;1" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="775" y="82" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="url(#stGrad)">★ Star on GitHub</text>
</svg>