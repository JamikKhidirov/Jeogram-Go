<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-labelledby="h5">
  <title id="h5">Раздел: админка и телеметрия</title>
  <style>
    .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;fill:#facc15}
    .s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;fill:#8ea2c4}
    .dash{stroke:#facc15;stroke-width:2;stroke-dasharray:10 10;animation:run 3s linear infinite}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow 2.8s ease-in-out infinite}
    @keyframes run{to{stroke-dashoffset:-40}}
    @keyframes grow{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  </style>
  <rect width="900" height="96" rx="18" fill="#080d1c"/>
  <rect x="1" y="1" width="898" height="94" rx="18" fill="none" stroke="#1d2b47" stroke-width="2"/>
  <rect x="14" y="18" width="6" height="60" rx="3" fill="#facc15"/>
  <circle cx="17" cy="48" r="12" fill="#facc15" opacity="0.35">
    <animate attributeName="opacity" values=".6;.15;.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text class="t" x="44" y="48">Админка и телеметрия</text>
  <text class="s" x="44" y="70">пользователи · устройства · статистика · рассылка</text>
  <line class="dash" x1="44" y1="82" x2="600" y2="82"/>
  <g fill="#facc15">
    <rect class="bar" x="742" y="52" width="10" height="18" rx="3" style="animation-delay:0s"/>
    <rect class="bar" x="760" y="42" width="10" height="28" rx="3" style="animation-delay:.2s"/>
    <rect class="bar" x="778" y="34" width="10" height="36" rx="3" style="animation-delay:.4s"/>
    <rect class="bar" x="796" y="46" width="10" height="24" rx="3" style="animation-delay:.6s"/>
    <rect class="bar" x="814" y="30" width="10" height="40" rx="3" style="animation-delay:.8s"/>
    <rect class="bar" x="832" y="44" width="10" height="26" rx="3" style="animation-delay:1s"/>
  </g>
</svg>