<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="typingT">
  <title id="typingT">Анимированная строка возможностей Jeogram — печатающийся текст</title>
  <defs>
    <linearGradient id="tpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#f472b6;#34d399;#22d3ee" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#f472b6;#34d399;#22d3ee;#8b5cf6" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#34d399;#22d3ee;#8b5cf6;#f472b6" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="tpGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="tpB"/>
      <feMerge>
        <feMergeNode in="tpB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tpC1"><rect x="52" y="50" width="0" height="46">
      <animate attributeName="width" values="0;0;1000;1000;0" keyTimes="0;0.02;0.32;0.97;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tpC2"><rect x="52" y="50" width="0" height="46">
      <animate attributeName="width" values="0;0;1000;1000;0" keyTimes="0;0.02;0.32;0.97;1" dur="4s" begin="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tpC3"><rect x="52" y="50" width="0" height="46">
      <animate attributeName="width" values="0;0;1000;1000;0" keyTimes="0;0.02;0.32;0.97;1" dur="4s" begin="8s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tpC4"><rect x="52" y="50" width="0" height="46">
      <animate attributeName="width" values="0;0;1000;1000;0" keyTimes="0;0.02;0.32;0.97;1" dur="4s" begin="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tpC5"><rect x="52" y="50" width="0" height="46">
      <animate attributeName="width" values="0;0;1000;1000;0" keyTimes="0;0.02;0.32;0.97;1" dur="4s" begin="16s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1200" height="130" rx="20" fill="#080d1c"/>
  <rect x="1" y="1" width="1198" height="128" rx="20" fill="none" stroke="#1d2b47" stroke-width="2"/>

  <text x="52" y="30" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8ea2c4">Go-бэкенд мессенджера · возможности</text>

  <rect x="26" y="46" width="6" height="50" rx="3" fill="url(#tpGrad)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="url(#tpGrad)" filter="url(#tpGlow)">
    <g clip-path="url(#tpC1)"><text x="52" y="86">realtime · WebSocket + Socket.IO</text></g>
    <g clip-path="url(#tpC2)"><text x="52" y="86">LiveKit · аудио и видео-звонки · запись</text></g>
    <g clip-path="url(#tpC3)"><text x="52" y="86">JWT access/refresh · 2FA (TOTP) · E2EE</text></g>
    <g clip-path="url(#tpC4)"><text x="52" y="86">PostgreSQL · Redis · Kafka · Prometheus</text></g>
    <g clip-path="url(#tpC5)"><text x="52" y="86">чистая архитектура · модульный монолит</text></g>
  </g>
</svg>
