<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="msgT">
  <title id="msgT">Анимированный чат Jeogram: сообщения, реакции, прочтение</title>
  <style>
    .bg{fill:#080d1c}
    .frame{fill:none;stroke:#1d2b47;stroke-width:2}
    .in{fill:#16223c;stroke:#243450}
    .out{fill:#1b2f58;stroke:#22d3ee;stroke-opacity:.55}
    .txt{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;fill:#e6ecf8}
    .head{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#22d3ee}
    .small{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;fill:#8ea2c4}
    .row{animation:pop 9s ease-in-out infinite}
    @keyframes pop{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:translateY(0)}90%{opacity:1}100%{opacity:1}}
    @keyframes blink{0%,60%{opacity:.25}61%,100%{opacity:1}}
    @keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:wave 1.1s ease-in-out infinite}
  </style>

  <rect class="bg" width="900" height="420" rx="22"/>
  <rect class="frame" x="1" y="1" width="898" height="418" rx="22"/>
  <text class="head" x="28" y="38">Jeogram · чат</text>
  <text class="small" x="28" y="58">текст · изображения · голосовые · реакции · ответы · закреплённые</text>
  <circle cx="856" cy="36" r="6" fill="#34d399">
    <animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="838" y="62" text-anchor="middle">online</text>

  <g class="row" style="animation-delay:0s">
    <rect class="in" x="28" y="84" width="300" height="48" rx="16"/>
    <text class="txt" x="48" y="114">Привет! Как дела?</text>
  </g>

  <g class="row" style="animation-delay:1.2s">
    <rect class="out" x="332" y="146" width="330" height="48" rx="16"/>
    <text class="txt" x="352" y="176">Всё отлично — пишу бэкенд на Go 🙂</text>
    <text class="small" x="646" y="172" fill="#34d399">✓✓</text>
  </g>

  <g class="row" style="animation-delay:2.4s">
    <rect class="in" x="28" y="208" width="270" height="118" rx="16"/>
    <rect x="44" y="224" width="238" height="62" rx="12" fill="#0f1a30" stroke="#243450"/>
    <circle cx="80" cy="255" r="14" fill="#1d2b47"/>
    <path d="M74 255 l14 -12 -4 12 4 12 z" fill="#22d3ee">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <g fill="#22d3ee">
      <rect class="bar" x="140" y="228" width="4" height="26" rx="2" style="animation-delay:0s"/>
      <rect class="bar" x="150" y="224" width="4" height="34" rx="2" style="animation-delay:.12s"/>
      <rect class="bar" x="160" y="228" width="4" height="22" rx="2" style="animation-delay:.24s"/>
      <rect class="bar" x="170" y="222" width="4" height="38" rx="2" style="animation-delay:.36s"/>
      <rect class="bar" x="180" y="228" width="4" height="24" rx="2" style="animation-delay:.48s"/>
      <rect class="bar" x="190" y="224" width="4" height="32" rx="2" style="animation-delay:.6s"/>
      <rect class="bar" x="200" y="232" width="4" height="18" rx="2" style="animation-delay:.72s"/>
    </g>
    <text class="small" x="250" y="272">0:07</text>
    <text class="small" x="44" y="308">голосовое сообщение · media/upload</text>
  </g>

  <g class="row" style="animation-delay:3.6s">
    <rect class="in" x="28" y="340" width="360" height="46" rx="14" fill="#0f1a30" stroke="#8b5cf6" stroke-opacity=".6"/>
    <text class="txt" x="48" y="368" fill="#c8d6ee">💬 реплай · пересылка · поиск по чату</text>
  </g>

  <g class="row" style="animation-delay:4.8s">
    <rect class="out" x="332" y="252" width="250" height="46" rx="14"/>
    <text class="txt" x="352" y="280">Отправил видео-звонок в LiveKit</text>
    <g>
      <rect x="596" y="262" width="52" height="26" rx="13" fill="#101b32" stroke="#243450"/>
      <text class="small" x="622" y="279" text-anchor="middle" fill="#f472b6">👍 3</text>
    </g>
    <g>
      <rect x="652" y="262" width="52" height="26" rx="13" fill="#101b32" stroke="#243450" style="animation:blink 2.6s infinite"/>
      <text class="small" x="678" y="279" text-anchor="middle" fill="#facc15">🔥 2</text>
    </g>
  </g>

  <g class="row" style="animation-delay:6s">
    <rect class="out" x="470" y="316" width="230" height="44" rx="14" fill="#16223c" stroke="#243450"/>
    <text class="small" x="490" y="336">печатает</text>
    <circle cx="562" cy="338" r="3" fill="#22d3ee" style="animation:blink 1.2s infinite"/>
    <circle cx="576" cy="338" r="3" fill="#22d3ee" style="animation:blink 1.2s infinite .2s"/>
    <circle cx="590" cy="338" r="3" fill="#22d3ee" style="animation:blink 1.2s infinite .4s"/>
  </g>
</svg>