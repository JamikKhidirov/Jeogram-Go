<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="logoT">
  <title id="logoT">Jeogram логотип</title>
  <defs>
    <linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="lgGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="56" fill="#0b1122"/>
  <g transform="translate(120 120)">
    <circle r="92" fill="none" stroke="#1e293b" stroke-width="3"/>
    <circle r="92" fill="none" stroke="url(#lgA)" stroke-width="3" stroke-linecap="round" stroke-dasharray="120 460">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#lgGlow)">
      <path d="M-30 -44 H18 v58 a30 30 0 0 1 -30 30 h-18 a30 30 0 0 1 -30 -30 v-6" fill="none" stroke="url(#lgA)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <circle cx="34" cy="-16" r="11" fill="#34d399">
        <animate attributeName="r" values="8;13;8" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M-58 -10 a18 18 0 0 1 0 -24">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M-72 -6 a34 34 0 0 1 0 -32">
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <rect width="240" height="240" rx="56" fill="none" stroke="#233050" stroke-width="3"/>
</svg>