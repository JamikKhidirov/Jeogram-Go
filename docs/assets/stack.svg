<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="stackT">
  <title id="stackT">Технологический стек Jeogram</title>
  <style>
    .bg{fill:#080d1c}
    .frame{fill:none;stroke:#1d2b47;stroke-width:2}
    .pill{fill:#0d1528;stroke-width:1.5;animation:float 4s ease-in-out infinite}
    .t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;text-anchor:middle}
    .cap{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#22d3ee}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  </style>

  <rect class="bg" width="1000" height="220" rx="22"/>
  <rect class="frame" x="1" y="1" width="998" height="218" rx="22"/>
  <text class="cap" x="30" y="38">Технологический стек</text>

  <g>
    <rect class="pill" x="30" y="60" width="120" height="40" rx="20" stroke="#22d3ee" style="animation-delay:0s"/>
    <text class="t" x="90" y="86" fill="#22d3ee">Go 1.26</text>
  </g>
  <g>
    <rect class="pill" x="160" y="60" width="130" height="40" rx="20" stroke="#8b5cf6" style="animation-delay:.2s"/>
    <text class="t" x="225" y="86" fill="#8b5cf6">Chi router</text>
  </g>
  <g>
    <rect class="pill" x="300" y="60" width="150" height="40" rx="20" stroke="#f472b6" style="animation-delay:.4s"/>
    <text class="t" x="375" y="86" fill="#f472b6">GORM</text>
  </g>
  <g>
    <rect class="pill" x="460" y="60" width="150" height="40" rx="20" stroke="#34d399" style="animation-delay:.6s"/>
    <text class="t" x="535" y="86" fill="#34d399">PostgreSQL</text>
  </g>
  <g>
    <rect class="pill" x="620" y="60" width="120" height="40" rx="20" stroke="#facc15" style="animation-delay:.8s"/>
    <text class="t" x="680" y="86" fill="#facc15">Redis</text>
  </g>
  <g>
    <rect class="pill" x="750" y="60" width="120" height="40" rx="20" stroke="#38bdf8" style="animation-delay:1s"/>
    <text class="t" x="810" y="86" fill="#38bdf8">Kafka</text>
  </g>
  <g>
    <rect class="pill" x="880" y="60" width="90" height="40" rx="20" stroke="#c084fc" style="animation-delay:1.2s"/>
    <text class="t" x="925" y="86" fill="#c084fc">LiveKit</text>
  </g>

  <g>
    <rect class="pill" x="30" y="118" width="150" height="40" rx="20" stroke="#22d3ee" style="animation-delay:.3s"/>
    <text class="t" x="105" y="144" fill="#22d3ee">gorilla/ws</text>
  </g>
  <g>
    <rect class="pill" x="190" y="118" width="140" height="40" rx="20" stroke="#8b5cf6" style="animation-delay:.5s"/>
    <text class="t" x="260" y="144" fill="#8b5cf6">JWT + bcrypt</text>
  </g>
  <g>
    <rect class="pill" x="340" y="118" width="130" height="40" rx="20" stroke="#34d399" style="animation-delay:.7s"/>
    <text class="t" x="405" y="144" fill="#34d399">TOTP 2FA</text>
  </g>
  <g>
    <rect class="pill" x="480" y="118" width="160" height="40" rx="20" stroke="#f472b6" style="animation-delay:.9s"/>
    <text class="t" x="560" y="144" fill="#f472b6">Swagger / OpenAPI</text>
  </g>
  <g>
    <rect class="pill" x="650" y="118" width="150" height="40" rx="20" stroke="#facc15" style="animation-delay:1.1s"/>
    <text class="t" x="725" y="144" fill="#facc15">Prometheus</text>
  </g>
  <g>
    <rect class="pill" x="810" y="118" width="160" height="40" rx="20" stroke="#38bdf8" style="animation-delay:1.3s"/>
    <text class="t" x="890" y="144" fill="#38bdf8">Docker / K8s</text>
  </g>

  <g fill="#1e293b">
    <rect x="30" y="176" width="970" height="1.5"/>
  </g>
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8ea2c4">
    <text x="30" y="200">Опционально: Kafka · Redis · LiveKit — приложение работает и без них</text>
    <circle cx="960" cy="196" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>