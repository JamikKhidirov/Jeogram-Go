      summary: Установить статус
      tags:
      - user
  /ws:
    get:
      description: 'Установите WebSocket-соединение по адресу `GET /ws`. Аутентификация:
        заголовок `Authorization: Bearer <access_token>` либо query-параметр `?token=<access_token>`.
        Сервер шлёт Ping каждые 30с и push-события в формате `{"type":"<event>","payload":{...}}`
        (например, `new_message`, `message_edited`, `message_deleted`, `call_invite`,
        `user_status`). Клиент может просто держать соединение открытым — это обеспечивает
        синхронизацию между устройствами одного пользователя.'
      responses:
        "101":
          description: Switching Protocols — WebSocket установлен
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Realtime WebSocket-соединение
      tags:
      - realtime
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
