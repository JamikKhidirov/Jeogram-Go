definitions:
  github_com_jeogram_messenger_internal_modules_auth_domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_jeogram_messenger_internal_modules_auth_domain.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_jeogram_messenger_internal_modules_auth_domain.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  github_com_jeogram_messenger_internal_modules_chat_domain.CreateGroupChatRequest:
    properties:
      avatar_url:
        maxLength: 512
        type: string
      participant_ids:
        items:
          type: string
        minItems: 1
        type: array
      title:
        maxLength: 128
        type: string
    required:
    - participant_ids
    - title
    type: object
  github_com_jeogram_messenger_internal_modules_chat_domain.CreatePrivateChatRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  github_com_jeogram_messenger_internal_modules_contact_domain.AddContactRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  github_com_jeogram_messenger_internal_modules_message_domain.EditMessageRequest:
    properties:
      text:
        type: string
    required:
    - text
    type: object
  github_com_jeogram_messenger_internal_modules_message_domain.ForwardRequest:
    properties:
      chat_id:
        type: string
    required:
    - chat_id
    type: object
  github_com_jeogram_messenger_internal_modules_message_domain.MarkReadRequest:
    properties:
      message_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - message_ids
    type: object
  github_com_jeogram_messenger_internal_modules_message_domain.ReactRequest:
    properties:
      emoji:
        type: string
    required:
    - emoji
    type: object
  github_com_jeogram_messenger_internal_modules_message_domain.SendMessageRequest:
    properties:
      chat_id:
        type: string
      media_url:
        type: string
      reply_to:
        type: string
      text:
        type: string
      type:
        enum:
        - text
        - voice
        - image
        type: string
    required:
    - chat_id
    - type
    type: object
  github_com_jeogram_messenger_internal_modules_notification_domain.Platform:
    enum:
    - ios
    - android
    - web
    type: string
    x-enum-varnames:
    - PlatformIOS
    - PlatformAndroid
    - PlatformWeb
  github_com_jeogram_messenger_internal_modules_notification_domain.RegisterDeviceRequest:
    properties:
      platform:
        allOf:
        - $ref: '#/definitions/github_com_jeogram_messenger_internal_modules_notification_domain.Platform'
        enum:
        - ios
        - android
        - web
      token:
        type: string
    required:
    - platform
    - token
    type: object
  github_com_jeogram_messenger_internal_modules_user_domain.BlockRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  github_com_jeogram_messenger_internal_modules_user_domain.UpdateProfileRequest:
    properties:
      avatar_url:
        maxLength: 512
        type: string
      display_name:
        maxLength: 128
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    type: object
  github_com_jeogram_messenger_internal_modules_user_domain.UpdateSettingsRequest:
    properties:
      language:
        type: string
      notifications_enabled:
        type: boolean
      online_visible:
        type: boolean
      theme:
        enum:
        - system
        - light
        - dark
        type: string
    type: object
  github_com_jeogram_messenger_internal_pkg_response.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  github_com_jeogram_messenger_internal_pkg_response.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_jeogram_messenger_internal_pkg_response.APIError'
      meta:
        $ref: '#/definitions/github_com_jeogram_messenger_internal_pkg_response.Meta'
      success:
        type: boolean
    type: object
  github_com_jeogram_messenger_internal_pkg_response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  modules_calls_handler.startCallRequest:
    properties:
      chat_id:
        type: string
      type:
        enum:
        - audio
        - video
        type: string
    required:
    - chat_id
    - type
    type: object
