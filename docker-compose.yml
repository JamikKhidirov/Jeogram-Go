# Сервисы инфраструктуры и само приложение Jeogram (мессенджер на Go).
# Запуск: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: jeogram-postgres
    environment:
      POSTGRES_USER: jeogram
      POSTGRES_PASSWORD: jeogram
      POSTGRES_DB: jeogram
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeogram"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jeogram-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: jeogram-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: jeogram-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: jeogram-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: jeogram-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jeogram-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jeogram.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jeogram-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_VERSION: "1.0.0"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      DB_DRIVER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: jeogram
      POSTGRES_PASSWORD: jeogram
      POSTGRES_DB: jeogram
      POSTGRES_SSLMODE: disable
      REDIS_ENABLED: "false"
      KAFKA_ENABLED: "false"
      JWT_ACCESS_SECRET: change-me-access-production
      JWT_REFRESH_SECRET: change-me-refresh-production
      JWT_ACCESS_TTL: 1h
      JWT_REFRESH_TTL: 168h
      JWT_ISSUER: jeogram
      MEDIA_UPLOAD_DIR: /data/uploads
      MEDIA_MAX_FILE_SIZE: "26214400"
      MEDIA_BASE_URL: http://localhost:8080/media
      METRICS_ENABLED: "true"
      METRICS_PATH: /metrics
      PUSH_ENABLED: "false"
      RTC_STUN_SERVERS: "stun:stun.l.google.com:19302"
      # Личный/self-hosted доступ: "*" = админ для любого авторизованного.
      # В продакшене замените на свой ID: ADMIN_USER_IDS: "ваш-uuid"
      ADMIN_USER_IDS: "*"
      LIVEKIT_ENABLED: "true"
      LIVEKIT_SERVER_URL: "ws://localhost:7800"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      LIVEKIT_ROOM_PREFIX: "jeogram_"
    volumes:
      - uploads-data:/data/uploads
    # Лейблы Traefik (используются только при запуске профиля `ssl`).
    # Если DOMAIN пустой — Host(localhost); приложение всё равно доступно по IP:8080.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-http.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.app-http.entrypoints=web"
      - "traefik.http.routers.app-http.middlewares=app-redirect"
      - "traefik.http.middlewares.app-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.app.loadbalancer.server.port=8080"

  # Reverse proxy с автоматическим SSL (Let's Encrypt).
  # Запуск: docker compose --profile ssl up -d  (при этом DOMAIN должен быть задан в .env)
  traefik:
    image: traefik:v3.1
    container_name: jeogram-traefik
    profiles: ["ssl"]
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt-data:/letsencrypt
    depends_on:
      - app

volumes:
  postgres-data:
  grafana-data:
  uploads-data:
  pgadmin-data:
  letsencrypt-data:

