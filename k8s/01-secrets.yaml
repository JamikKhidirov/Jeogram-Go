# Секреты приложения. НЕ КОММИТЬТЕ РЕАЛЬНЫЕ ЗНАЧЕНИЯ В GIT!
# Сгенерируйте свои значения, например:
#   echo -n "$(openssl rand -base64 48)" | base64
# Либо создайте секрет из командной строки:
#   kubectl -n jeogram create secret generic jeogram-secrets \
#     --from-literal=postgres-password=<ПАРОЛЬ> \
#     --from-literal=jwt-access-secret=<СЕКРЕТ> \
#     --from-literal=jwt-refresh-secret=<СЕКРЕТ> \
#     --from-literal=apns-key=<СОДЕРЖИМОЕ_APNS_КЛЮЧА> \
#     --from-literal=fcm-server-key=<FCM_СЕРВЕРНЫЙ_КЛЮЧ>
apiVersion: v1
kind: Secret
metadata:
  name: jeogram-secrets
  namespace: jeogram
type: Opaque
stringData:
  # Пароль от PostgreSQL (используется и в postgres, и в APP через POSTGRES_PASSWORD).
  postgres-password: "jeogram"
  # Секреты подписи JWT. ОБЯЗАТЕЛЬНО ЗАМЕНИТЕ на случайные строки в production!
  jwt-access-secret: "change-me-access-please-replace"
  jwt-refresh-secret: "change-me-refresh-please-replace"
  # Ключи push-уведомлений (необязательно, PUSH_ENABLED=false по умолчанию).
  fcm-server-key: ""
  apns-key: ""
