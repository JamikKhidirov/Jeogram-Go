apiVersion: v1
kind: Secret
metadata:
  name: jeogram-postgres
  namespace: jeogram
type: Opaque
stringData:
  # Пароль суперпользователя PostgreSQL. Должен совпадать с jeogram-secrets -> postgres-password.
  postgres-password: "jeogram"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: jeogram
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "jeogram"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jeogram-postgres
                  key: postgres-password
            - name: POSTGRES_DB
              value: "jeogram"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jeogram
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
